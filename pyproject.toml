[project]
name = "ai-change-impact-analyzer"
version = "0.1.0"
description = "AI system to analyze business/policy changes and predict technical, operational, and risk impacts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",

    # LLM & AI
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",

    # Vector Database & Retrieval
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",

    # Document Processing
    "unstructured>=0.12.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Observability
    "structlog>=24.1.0",

    # Frontend
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"